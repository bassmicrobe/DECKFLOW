worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json;
        application/manifest+json webmanifest;
        application/wasm wasm;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/x-icon ico;
        text/plain txt md;
        audio/mpeg mp3;
        audio/wav wav;
        audio/ogg ogg;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/json application/manifest+json image/svg+xml;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only content-versioned assets get a long browser cache lifetime.
    # HTML and the update-checking service worker always revalidate.
    map $uri $versioned_asset {
        default 1;
        / 0;
        /sw.js 0;
        ~\.html$ 0;
    }
    map "$versioned_asset:$arg_v" $asset_cache_control {
        default "no-cache";
        "~^1:[a-f0-9]{16}$" "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $asset_cache_control always;
        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
